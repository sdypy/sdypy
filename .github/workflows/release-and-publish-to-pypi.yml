name: Release and publish to PyPI

# The only way to release an SDyPy package (AGENTS.md, section Releasing, in
# the sdypy hub): Actions -> "Release and publish to PyPI" -> Run workflow, on
# the default branch, with the new version. The workflow writes the version
# into pyproject.toml, commits it, tags that commit vX.Y.Z, pushes both,
# publishes to PyPI and creates the GitHub Release. A v* tag pushed by hand
# publishes nothing.
#
# This file is the sdypy hub's. Every first-level package copies it verbatim
# (sibling-package-template spec, checked by tools/check_sibling_template.py),
# so edit it only in the hub.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, X.Y.Z (no leading v)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump, build and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Refuse to release from any branch but the default
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::run the release on $DEFAULT_BRANCH, not $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --upgrade pip build packaging
      - name: Check the version and write it into pyproject.toml
        run: |
          python - <<'EOF'
          # release-step: bump
          import os, re, subprocess, sys, tomllib
          from pathlib import Path
          from packaging.version import Version

          def fail(message):
              print("::error::" + message)
              sys.exit(1)

          new = os.environ["VERSION"]
          if not re.fullmatch(r"\d+\.\d+\.\d+((a|b|rc)\d+)?", new):
              fail("version %r is not X.Y.Z (optionally followed by aN, bN or rcN)" % new)
          tag = "v" + new
          exists = subprocess.run(["git", "rev-parse", "-q", "--verify", "refs/tags/" + tag],
                                  capture_output=True).returncode == 0
          if exists:
              fail("tag %s already exists" % tag)
          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          old = tomllib.loads(text).get("project", {}).get("version")
          if not isinstance(old, str):
              fail("pyproject.toml has no literal [project] version")
          if Version(new) <= Version(old):
              fail("version %s is not newer than the current %s" % (new, old))
          # Rewrite the version line of the [project] table only.
          table = re.search(r"(?ms)^\[project\][ \t]*\n(.*?)(?=^\[|\Z)", text)
          body, count = re.subn(r'(?m)^(version[ \t]*=[ \t]*)"[^"]*"',
                                lambda m: '%s"%s"' % (m.group(1), new), table.group(1), count=1)
          if count != 1:
              fail("no version line found in the [project] table")
          text = text[:table.start(1)] + body + text[table.end(1):]
          if tomllib.loads(text)["project"]["version"] != new:
              fail("rewriting pyproject.toml did not set the version")
          path.write_text(text, encoding="utf-8")
          print("version %s -> %s" % (old, new))
          EOF
      - name: Commit and tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "Release $VERSION"
          git tag -a "v$VERSION" -m "Release $VERSION"
      - name: Build sdist and wheel
        run: python -m build
      - name: Check that the distributions carry the version
        run: |
          python - <<'EOF'
          # release-step: check-dist
          import os, sys
          from pathlib import Path
          from packaging.version import Version

          new = Version(os.environ["VERSION"])
          found = {"wheel": 0, "sdist": 0}
          for f in sorted(Path("dist").iterdir()):
              if f.name.endswith(".whl"):
                  kind, version = "wheel", f.name.split("-")[1]
              elif f.name.endswith(".tar.gz"):
                  kind, version = "sdist", f.name[:-len(".tar.gz")].rsplit("-", 1)[1]
              else:
                  continue
              if Version(version) != new:
                  print("::error::%s carries version %s, expected %s" % (f.name, version, new))
                  sys.exit(1)
              found[kind] += 1
          if found["wheel"] != 1 or found["sdist"] != 1:
              print("::error::expected one wheel and one sdist, found %s" % found)
              sys.exit(1)
          print("dist carries version %s" % new)
          EOF
      - name: Push the release commit and tag
        # Atomic: both refs land or neither does. If the default branch moved
        # since this run started, the push is rejected and nothing is published.
        run: git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/v$VERSION"
      - name: Store the distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    # Token where the repository has a PYPI_API_TOKEN secret; without it the
    # action falls back to trusted publishing (PyPI side: this workflow file
    # and the environment "pypi").
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    name: Create the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the release
        run: >
          gh release create "v$VERSION" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          --title "v$VERSION"
